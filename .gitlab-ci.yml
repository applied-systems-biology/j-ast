      files_json="$(
        curl --silent --show-error --fail-with-body \
          --header "PRIVATE-TOKEN: $PACKAGE_UPLOAD_TOKEN" \
          "$package_files_url"
      )"
      for file in dist/server/j-ast-server-*-*.tar.gz \
