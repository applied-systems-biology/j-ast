# GitLab CI configuration for J-AST Electron build
# This CI pipeline builds the Electron application for multiple platforms and packages the outputs

stages:
  - build
  - package
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  NODE_VERSION: "20"

# Cache dependencies to speed up builds
cache:
  paths:
    - .m2/repository/
    - frontend/node_modules/
    - frontend/.quasar/

# Job template for shared configuration
.default_build_template: &default_build
  interruptible: true
  retry: 1
  image: maven:3-eclipse-temurin-21-jammy
  before_script:
    - apt-get update
    - apt-get install -y nsis git zip unzip curl wget
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - node --version
    - npm --version
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - npm i -g @quasar/cli
    - quasar --version

# Build job that runs on all branches to ensure code quality
build:
  stage: build
  <<: *default_build
  script:
    - echo "Building backend..."
    - cd backend
    - mvn clean package -DskipTests
    - cd ..
    - echo "Building frontend..."
    - cd frontend
    - npm install
    - quasar build -m electron
    - cd ..
  artifacts:
    paths:
      - backend/target/j-ast-backend*.jar
      # - frontend/dist/electron/Packaged/
    expire_in: 1 week

# Package stage - Create the final packages
package:
  stage: package
  image: maven:3-eclipse-temurin-21-jammy
  <<: *default_build
  script:
    - chmod +x dist/electron/build.sh
    - echo "Building Electron packages..."
    - cd dist/electron
    - ./build.sh
    - cd ../..
  artifacts:
    paths:
      - dist/electron/j-ast-*-macos-arm64.zip
      - dist/electron/j-ast-*-linux-x64.tar.gz
      - dist/electron/j-ast-*-windows-x64.zip
      - dist/electron/j-ast-*-windows-x64-installer.exe
    expire_in: 1 month
  needs:
    - build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - when: manual

# Deploy to GitLab packages repository
deploy:
  stage: deploy
  image: curlimages/curl:8.10.1
  script:
    - echo "Deploying packages to GitLab Generic Package Registry..."

    # Discover a version from the first artifact filename: j-ast-<VERSION>-<platform>.<ext>
    - |
      find dist/electron -maxdepth 1 -type f \( -name 'j-ast-*-*.tar.gz' -o -name 'j-ast-*-*.zip' -o -name 'j-ast-*-*.exe' \) | head -n1 > .first_file || true
      if [ ! -s .first_file ]; then
        echo "No artifacts found to upload." >&2
        exit 0
      fi
      FIRST_FILE="$(cat .first_file)"
      PACKAGE_NAME="j-ast"
      PACKAGE_VERSION="$(basename "$FIRST_FILE" | sed -E 's/^j-ast-([^ -]+)-.*$/\1/')"
      echo "Detected version: ${PACKAGE_VERSION}"

    # Upload helper (PUT raw bytes, no multipart)
    - |
      upload_generic () {
        file="$1"; fname="$(basename "$file")"
        echo "Uploading $file ..."
        echo "File size: $(du -h "$file" | cut -f1)"
        curl -sS \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --header "Content-Type: application/octet-stream" \
          --retry 3 --retry-delay 2 --fail \
          --request PUT \
          --upload-file "$file" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${PACKAGE_VERSION}/${fname}"
        echo
      }

    # Upload all artifacts
    - |
      for file in dist/electron/j-ast-*-*.tar.gz \
                  dist/electron/j-ast-*-*.zip \
                  dist/electron/j-ast-*-*.exe
      do
        if [ -f "$file" ]; then
          upload_generic "$file"
        else
          echo "File not found: $file"
        fi
      done
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  when: on_success
  needs:
    - package
