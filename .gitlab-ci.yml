# GitLab CI configuration for J-AST Electron build
# This CI pipeline builds the Electron application for multiple platforms and packages the outputs

stages:
  - build
  - package
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  NODE_VERSION: "20"

# Cache dependencies to speed up builds
cache:
  paths:
    - .m2/repository/
    - frontend/node_modules/
    - frontend/.quasar/

# Job template for shared configuration
.default_build_template: &default_build
  interruptible: true
  retry: 1
  image: maven:3-eclipse-temurin-21-jammy
  before_script:
    - apt-get update
    - apt-get install -y nsis git zip unzip curl wget patch
    - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
    - apt-get install -y nodejs
    - node --version
    - npm --version
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - npm i -g @quasar/cli
    - quasar --version

# Build job that runs on all branches to ensure code quality
build_electron:
  stage: build
  <<: *default_build
  script:
    - echo "Building backend..."
    - cd backend
    - mvn clean package -DskipTests
    - cd ..
    - echo "Building frontend..."
    - cd frontend
    - npm install
    - quasar build -m electron
    - cd ..
  artifacts:
    paths:
      - backend/target/j-ast-backend*.jar
    expire_in: 1 week

build_server:
  stage: build
  <<: *default_build
  script:
    - echo "Building server..."
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - backend/target/j-ast-backend*.jar
    expire_in: 1 week

build_server_leibniz_hki:
  stage: build
  <<: *default_build
  script:
    - echo "Building server for HKI..."
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - backend/target/j-ast-backend*.jar
    expire_in: 1 day

# Package stage - Create the final packages
package_electron:
  stage: package
  image: maven:3-eclipse-temurin-21-jammy
  <<: *default_build
  script:
    - chmod +x dist/electron/build.sh
    - echo "Building Electron packages..."
    - cd dist/electron
    - chmod +x ./build.sh
    - ./build.sh
    - cd ../..
  artifacts:
    paths:
      - dist/electron/j-ast-*-macos-arm64.zip
      - dist/electron/j-ast-*-linux-x64.tar.gz
      - dist/electron/j-ast-*-windows-x64.zip
      - dist/electron/j-ast-*-windows-x64-installer.exe
    expire_in: 1 month
  needs:
    - job: build_electron
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

package_server:
  stage: package
  image: maven:3-eclipse-temurin-21-jammy
  <<: *default_build
  script:
    - chmod +x dist/server/build.sh
    - echo "Building server packages..."
    - cd dist/server
    - chmod +x ./build.sh
    - ./build.sh $CI_PIPELINE_IID / /api
    - cd ../..
  artifacts:
    paths:
      - dist/server/j-ast-server-*-macos-arm64.zip
      - dist/server/j-ast-server-*-linux-x64.tar.gz
      - dist/server/j-ast-server-*-windows-x64.zip
    expire_in: 1 month
  needs:
    - job: build_server
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

package_server_leibniz_hki:
  stage: package
  image: maven:3-eclipse-temurin-21-jammy
  <<: *default_build
  script:
    - chmod +x dist/server/build.sh
    - echo "Building server packages for Leibniz-HKI..."
    - cd dist/server-hki
    - chmod +x ./build.sh
    - ./build.sh $CI_PIPELINE_IID /j-ast-app /j-ast-app/api
    - cd ../..
  artifacts:
    paths:
      - dist/server-hki/j-ast-server-*-linux-x64.tar.gz
    expire_in: 1 day
  needs:
    - job: build_server_leibniz_hki
      optional: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'

# Deploy to GitLab packages repository
deploy_electron:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl jq
  script:
    - set -euo pipefail
    - echo "Deploying packages to GitLab Generic Package Registry..."

    # Verify that the upload token is available and valid
    - |
      test -n "${PACKAGE_UPLOAD_TOKEN:-}" || {
        echo "PACKAGE_UPLOAD_TOKEN is not set. Create a masked CI/CD variable containing a GitLab project access token with api scope."
        exit 1
      }
      echo "Testing PACKAGE_UPLOAD_TOKEN against project API ..."
      token_test_code="$(
        curl --silent --show-error \
          --output /tmp/package-token-test-body.txt \
          --write-out "%{http_code}" \
          --header "PRIVATE-TOKEN: $PACKAGE_UPLOAD_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID"
      )"
      echo "Token test HTTP status: $token_test_code"
      if [ "$token_test_code" != "200" ]; then
        echo "PACKAGE_UPLOAD_TOKEN could not access this project via the GitLab API."
        cat /tmp/package-token-test-body.txt || true
        exit 1
      fi

    # Discover a version from the first artifact filename: j-ast-<VERSION>-<platform>.<ext>
    - |
      find dist/electron -maxdepth 1 -type f \( -name 'j-ast-*-*.tar.gz' -o -name 'j-ast-*-*.zip' -o -name 'j-ast-*-*.exe' \) | head -n1 > .first_file || true
      if [ ! -s .first_file ]; then
        echo "No artifacts found to upload." >&2
        exit 0
      fi
      FIRST_FILE="$(cat .first_file)"
      PACKAGE_NAME="j-ast-desktop"
      PACKAGE_VERSION="$(basename "$FIRST_FILE" | sed -E 's/^j-ast-([^ -]+)-.*$/\1/')"
      echo "Detected version: ${PACKAGE_VERSION}"
      BASE_API="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE_NAME/$PACKAGE_VERSION"

    # Upload helper (PUT raw bytes via --upload-file, no multipart)
    - |
      upload_generic () {
        file="$1"; fname="$(basename "$file")"
        url="$BASE_API/$fname"
        echo "Uploading $file ..."
        echo "File size: $(du -h "$file" | cut -f1)"

        body="$(mktemp)"
        headers="$(mktemp)"

        http_code="$(
          curl \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --silent \
            --show-error \
            --fail-with-body \
            --upload-file "$file" \
            --dump-header "$headers" \
            --output "$body" \
            --write-out "%{http_code}" \
            --header "PRIVATE-TOKEN: $PACKAGE_UPLOAD_TOKEN" \
            --header "Expect:" \
            "$url"
        )"

        echo "HTTP status for $fname: $http_code"

        if [ "$http_code" != "201" ]; then
          echo "Upload failed for $fname"
          echo
          echo "Response headers:"
          cat "$headers" || true
          echo
          echo "Response body:"
          cat "$body" || true
          echo
          exit 1
        fi

        echo "Upload successful for $fname"
        cat "$body" || true
        echo
      }

    # Upload all artifacts
    - |
      for file in dist/electron/j-ast-*-*.tar.gz \
                  dist/electron/j-ast-*-*.zip \
                  dist/electron/j-ast-*-*.exe
      do
        if [ -f "$file" ]; then
          upload_generic "$file"
        else
          echo "File not found: $file"
        fi
      done

    # Verify uploaded files are present in the registry
    - |
      echo "Verifying uploaded package files ..."
      package_lookup_url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages?package_type=generic&package_name=$PACKAGE_NAME&package_version=$PACKAGE_VERSION"
      package_json="$(
        curl --silent --show-error --fail-with-body \
          --header "PRIVATE-TOKEN: $PACKAGE_UPLOAD_TOKEN" \
          "$package_lookup_url"
      )"
      package_id="$(echo "$package_json" | jq -r '.[0].id // empty')"
      if [ -z "$package_id" ]; then
        echo "Could not find package after upload: $PACKAGE_NAME/$PACKAGE_VERSION"
        echo "$package_json" | jq . || echo "$package_json"
        exit 1
      fi
      echo "Found package ID: $package_id"
      package_files_url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/$package_id/package_files?per_page=100"
      files_json="$(
        curl --silent --show-error --fail-with-body \
          --header "PRIVATE-TOKEN: $PACKAGE_UPLOAD_TOKEN" \
          "$package_files_url"
      )"
      for file in dist/electron/j-ast-*-*.tar.gz \
                  dist/electron/j-ast-*-*.zip \
                  dist/electron/j-ast-*-*.exe
      do
        [ -f "$file" ] || continue
        fname="$(basename "$file")"
        if ! echo "$files_json" | jq -e --arg name "$fname" '.[] | select(.file_name == $name)' >/dev/null; then
          echo "Missing uploaded package file: $fname"
          echo "$files_json" | jq . || echo "$files_json"
          exit 1
        fi
        echo "Verified package file: $fname"
      done
      echo "All expected package files are present."
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  needs:
    - package_electron

# Deploy to GitLab packages repository
deploy_server_packages:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache curl jq
  script:
    - set -euo pipefail
    - echo "Deploying server packages to GitLab Generic Package Registry..."

    # Verify that the upload token is available and valid
    - |
      test -n "${PACKAGE_UPLOAD_TOKEN:-}" || {
        echo "PACKAGE_UPLOAD_TOKEN is not set. Create a masked CI/CD variable containing a GitLab project access token with api scope."
        exit 1
      }
      echo "Testing PACKAGE_UPLOAD_TOKEN against project API ..."
