      if [ ! -s .first_file ]; then
        echo "No artifacts found to upload." >&2
        exit 0
      fi
      FIRST_FILE="$(cat .first_file)"
      PACKAGE_NAME="j-ast-server"
      PACKAGE_VERSION="$(basename "$FIRST_FILE" | sed -E 's/^j-ast-server-([^ -]+)-.*$/\1/')"
      echo "Detected version: ${PACKAGE_VERSION}"
      BASE_API="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/$PACKAGE_NAME/$PACKAGE_VERSION"

    # Upload helper (PUT raw bytes via --upload-file, no multipart)
    - |
      upload_generic () {
        file="$1"; fname="$(basename "$file")"
        url="$BASE_API/$fname"
        echo "Uploading $file ..."
        echo "File size: $(du -h "$file" | cut -f1)"

        body="$(mktemp)"
        headers="$(mktemp)"

        http_code="$(
          curl \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --silent \
            --show-error \
            --fail-with-body \
            --upload-file "$file" \
            --dump-header "$headers" \
            --output "$body" \
            --write-out "%{http_code}" \
            --header "PRIVATE-TOKEN: $PACKAGE_UPLOAD_TOKEN" \
            --header "Expect:" \
            "$url"
        )"

        echo "HTTP status for $fname: $http_code"

        if [ "$http_code" != "201" ]; then
