        fi
      done

    # Verify uploaded files are present in the registry
    - |
      echo "Verifying uploaded package files ..."
      package_lookup_url="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages?package_type=generic&package_name=$PACKAGE_NAME&package_version=$PACKAGE_VERSION"
      package_json="$(
        curl --silent --show-error --fail-with-body \
          --header "PRIVATE-TOKEN: $PACKAGE_UPLOAD_TOKEN" \
          "$package_lookup_url"
      )"
      package_id="$(echo "$package_json" | jq -r '.[0].id // empty')"
      if [ -z "$package_id" ]; then
