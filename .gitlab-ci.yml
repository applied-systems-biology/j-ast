      }

    # Upload all artifacts
    - |
      for file in dist/server/j-ast-server-*-*.tar.gz \
                  dist/server/j-ast-server-*-*.zip \
                  dist/server/j-ast-server-*-*.exe
      do
        if [ -f "$file" ]; then
          upload_generic "$file"
        else
