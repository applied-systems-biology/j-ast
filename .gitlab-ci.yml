      done
      echo "All expected package files are present."
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  needs:
    - package_server

  # Deploy to Leibniz-HKI
deploy_leibniz_hki:
  stage: deploy
  tags: [ "tromos", "deploy" ]
  needs: [ package_server_leibniz_hki ]
  script:
    - set -euo pipefail
    - rm -rv /opt/jastapp/tmp || true
    - mkdir /opt/jastapp/tmp
    - cp dist/server-hki/j-ast-server-*-linux-x64.tar.gz /opt/jastapp/tmp/server.tar.gz
    - cd /opt/jastapp/tmp/ && tar -xvf server.tar.gz
    - rm -rvf /opt/jastapp/app/share /opt/jastapp/app/bin
    - mv -v /opt/jastapp/tmp/j-ast-server-linux-x64/bin /opt/jastapp/app/bin
    - mv -v /opt/jastapp/tmp/j-ast-server-linux-x64/share /opt/jastapp/app/share
    - chmod 664 /opt/jastapp/tmp/j-ast-server-linux-x64/server.jar
    - mv -f /opt/jastapp/tmp/j-ast-server-linux-x64/server.jar /opt/jastapp/app/server.jar
    - rm -rv /opt/jastapp/tmp/* || true
  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'
  environment:
    name: production
