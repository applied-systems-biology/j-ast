spring:
  datasource:
    url: 'jdbc:mariadb://localhost:3306/jipipe_growth_assay'
    username: jipipe_web
    password: jipipe_web
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
org:
  jobrunr:
    background-job-server:
      enabled: true
      worker-count: 1
    dashboard:
      enabled: false
runtime:
  fiji-path: '/opt/app/fiji-bin-linux'
  fiji-executable-path: '/opt/app/fiji-bin-linux/ImageJ-linux64'
  fiji-args: ['--memory', '8G']
  fiji-wrapper: '/usr/bin/xvfb-run'
  fiji-wrapper-args: [ '-a' ]
runtime-parameters:
  time-point-early-parameter-key: 'e3d4a323-851b-49f8-960d-80e972ff94ad/custom-variables/timePointEarly'
  min-rel-diff-threshold-parameter-key: '32215cd8-a746-4b10-a1fe-577cc374386c/custom-expression-variables/minreldiff'
accounts:
  admin-username: 'admin@localhost'
  admin-password: 'Ckw55ryzy1mXGxb8'


