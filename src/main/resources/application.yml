spring:
  datasource:
    url: jdbc:h2:file:./storage/database
    username: sa
    password: password
    driverClassName: org.h2.Driver
#    url: 'jdbc:mariadb://localhost:3306/jipipe_growth_assay'
#    username: jipipe_web
#    password: jipipe_web
#    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
org:
  jobrunr:
    background-job-server:
      enabled: true
      worker-count: 1
    dashboard:
      enabled: false
runtime:
  fiji-path: 'fiji-bin/linux'
  fiji-executable-path: 'fiji-bin/linux/ImageJ-linux64'
  fiji-args: ['--memory', '8G']
  fiji-wrapper: '/usr/bin/xvfb-run'
  fiji-wrapper-args: [ '-a' ]
runtime-parameters:
  time-point-early-filter-parameter-key: 'e3d4a323-851b-49f8-960d-80e972ff94ad/filter'
  growth-reduction-thresholds-parameter-key: 'f37619df-9f61-4033-b000-1271b68b5f68/variables/thresholds'
  dda-min-diameter-parameter-key: '0f0ac686-e04e-4591-819e-31b5bf755759/custom-filter-variables/minFeret'
  dda-max-diameter-parameter-key: '0f0ac686-e04e-4591-819e-31b5bf755759/custom-filter-variables/maxFeret'
  dda-min-circularity-parameter-key: '0f0ac686-e04e-4591-819e-31b5bf755759/custom-filter-variables/minCirc'
  contrast-min-value-parameter-key: '5bfee4f0-7076-4959-b097-ac557442fa98/custom-min'
  contrast-max-value-parameter-key: '5bfee4f0-7076-4959-b097-ac557442fa98/custom-max'
  input-folder-list-parameter-key: '9663ce59-8770-456a-a5a0-9b3254c8f021/folder-paths'
  ensure-circular-plate-parameter-key: '2fbccdbb-e361-4645-b954-593692b75e2e/custom-variables/circular-plate'
