<div class="card bg-light" th:fragment="dataset-editor-parameters">
  <div class="card-header">
    <span>Parameters</span>
  </div>
  <div class="card-body">
    <div class="mb-3">
      <label for="parameter-percentage-of-inhibition" class="form-label">Percentage of inhibition</label>
      <div class="input-group">
        <input type="number" min="0" max="100" class="form-control input-parameter-editor" id="parameter-percentage-of-inhibition" data-parameter-property="percentage-of-inhibition" autocomplete="off" th:value="${currentDataset.percentageOfInhibition}">
        <span class="input-group-text">%</span>
      </div>
    </div>
    <div class="mb-3">
      <label for="parameter-time-point-early" class="form-label">Early time point</label>
      <input type="text" class="form-control input-parameter-editor" id="parameter-time-point-early" data-parameter-property="time-point-early" autocomplete="off" th:value="${currentDataset.timePointEarly}">
      <div class="form-text">
        The <code>Time point</code> that contains the early snapshot of the assays (e.g., 24hr).
      </div>
    </div>
    <div class="mb-3">
      <label for="parameter-time-point-late" class="form-label">Late time point</label>
      <input type="text" class="form-control input-parameter-editor" id="parameter-time-point-late" data-parameter-property="time-point-late" th:value="${currentDataset.timePointLate}">
      <div class="form-text">
        The <code>Time point</code> that contains the late snapshot of the assays (e.g., 48hr).
      </div>
    </div>
    <hr/>
    <div class="mb-3">
      <label class="form-label">DDA: Diameter constraint (mm)</label>
      <div class="d-flex">
        <div class="flex-grow-1"><input type="number" step="any" class="form-control input-parameter-editor" id="parameter-dda-disk-min-diameter" data-parameter-property="dda-disk-min-diameter" th:value="${currentDataset.ddaDiskMinDiameter}"></div>
        <div class="p-2">-</div>
        <div class="flex-grow-1"><input type="number" step="any" class="form-control input-parameter-editor" id="parameter-dda-disk-max-diameter" data-parameter-property="dda-disk-max-diameter" th:value="${currentDataset.ddaDiskMaxDiameter}"></div>
      </div>
      <div class="form-text">
        The minimum and maximum diameter of the DDA disk
      </div>
    </div>
    <div class="mb-3">
      <label for="parameter-dda-disk-min-circularity" class="form-label">DDA: Minimum circularity</label>
      <input type="number" step="any" class="form-control input-parameter-editor" id="parameter-dda-disk-min-circularity" data-parameter-property="dda-disk-min-circularity" th:value="${currentDataset.ddaDiskMinCircularity}">
      <div class="form-text">
        The value range is from 0.0 to 1.0
      </div>
    </div>
  </div>
</div>
