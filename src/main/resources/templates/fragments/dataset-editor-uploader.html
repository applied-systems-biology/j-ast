<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<div class="uploader" th:fragment="timeSeries-editor-uploader" style="display: block;">
    <div class="card">
        <div class="card-body">
            <div class="mb-3">
                <label for="uploader-input-files" class="form-label">Raw images (*.png)</label>
                <input type="file" class="form-control" id="uploader-input-files" multiple accept="image/png" autocomplete="off"/>
            </div>
        </div>
        <div class="card-footer d-flex gap-3 align-items-center">
            <div class="progress flex-grow-1" role="progressbar">
                <div class="progress-bar progress-bar-striped progress-bar-animated uploader-progress-bar" style="width: 0">0</div>
            </div>
            <button type="button" class="btn btn-success button-uploader-upload"><i class="fa fas fa-upload"></i> Upload</button>
        </div>
    </div>
    <script>

        function uploadFile(file) {
            let formData = new FormData()
            formData.append("imageFile", file)
            const token = $('#_csrf').attr('content');
            const header = $('#_csrf_header').attr('content');
            return $.ajax({
                type: "POST",
                url: getURL("timeSeries/upload-input/" + currentProjectId),
                data: formData,
                processData: false,
                contentType: false,
                beforeSend: function (xhr) {
                    xhr.setRequestHeader(header, token);
                }
            })
        }

        function startUpload() {
            const files = $("#uploader-input-files").prop("files")
            if (files.length > 0) {
                $(".button-run").prop("disabled", true)
                $(".button-uploader-close").prop("disabled", true)
                $(".button-uploader-upload").prop("disabled", true)
                $(".button-rename").prop("disabled", true)
                $(".button-delete").prop("disabled", true)
                $(".button-delete-input-data").prop("disabled", true)
                $(".input-parameter-editor").prop("disabled", true)
                $(".input-data-editor").prop("disabled", true)
                updateSaveProgress(true)

                let index = 0
                let numSuccesses = 0
                let numFailures = 0

                function updateProgressBar() {
                    $(".uploader-progress-bar")
                        .css("width", ((index / files.length) * 100) + "%")
                        .text(`${index}/${files.length} (${numSuccesses} successes, ${numFailures} failures)`)
                }

                function uploadNextFile() {
                    if (index < files.length) {
                        const jqhxr = uploadFile(files.item(index))
                        jqhxr.done(function () {
                            numSuccesses += 1
                            updateProgressBar()
                        })
                        jqhxr.fail(function () {
                            numFailures += 1
                            updateProgressBar()
                        })
                        jqhxr.always(function () {
                            index = index + 1
                            updateProgressBar()
                            uploadNextFile()
                        })
                    } else {
                        location.reload()
                    }
                }

                uploadNextFile()
            }
        }

        function openUploader() {
            // $(".button-add-data").prop("disabled", true)
            // $(".uploader").slideDown()
        }

        function closeUploader() {
            // $(".uploader").slideUp()
            // $(".button-add-data").prop("disabled", false)
        }

        $(document).ready(() => {
            // $(".button-add-data").on("click", function () {
            //   openUploader()
            // })
            // $(".button-uploader-close").on("click", function () {
            //   closeUploader()
            // })
            $(".button-uploader-upload").on("click", function () {
                startUpload()
            })
        })
    </script>
</div>
