<div th:fragment="dataset-editor-table">
    <div class="card-body">
        <div>
            <table class="table align-middle">
                <thead>
                <tr>
                    <th scope="col"></th>
                    <th scope="col"></th>
                    <th scope="col">Type</th>
<!--                    <th scope="col">Size</th>-->
                    <th scope="col">Original file name</th>
                    <th scope="col">Experiment</th>
                    <th scope="col">Sample</th>
                    <th scope="col">Time point</th>
                    <th scope="col">Plate diameter (mm)</th>
                    <th scope="col">ZOI shape</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="inputData: ${currentDataset?.inputData}"
                    th:id="'input-data-editor-' + ${inputData.id}" class="input-data-editor">
                    <th scope="col">
                        <div class="d-flex flex-row">
                            <button class="button-delete-input-data btn btn-sm btn-outline-danger"
                                    th:data-input-data-id="${inputData.id}"><i class="fa fas fa-times"></i>
                            </button>
                            <a class="ms-1 btn btn-sm btn-outline-primary"
                               th:href="@{'/input-data/download/' + ${inputData.id}}"><i
                                    class="fa fas fa-download"></i></a>
                        </div>
                    </th>
                    <th scope="col"><a th:href="@{'/input-data/view/' + ${inputData.id}}"
                                       target="_blank"><img
                            th:src="@{'/input-data/thumbnail/' + ${inputData.id}}" alt="Thumbnail"/></a>
                    </th>
                    <th scope="col">
                        <select class="form-select input-data-editor" th:data-input-data-id="${inputData.id}" data-input-data-property="assayType">
                            <option th:selected="${inputData.assayType.toString().equals('DDA')}" value="DDA">DDA</option>
                            <option th:selected="${inputData.assayType.toString().equals('ETest')}" value="ETest">E-Test</option>
                        </select>
                    </th>
<!--                    <th scope="col" class="text-muted" th:text="${inputData.imageWidth + ' ⨉ ' + inputData.imageHeight + ' px'}"></th>-->
                    <th scope="col" class="fs-6 font-monospace fw-light" th:text="${inputData.originalFileName}"></th>
                    <th scope="col"><input class="form-control input-data-editor" type="text" data-input-data-property="experiment" th:data-input-data-id="${inputData.id}" th:value="${inputData.experiment}" autocomplete="off"/></th>
                    <th scope="col"><input class="form-control input-data-editor" type="text" data-input-data-property="sample" th:data-input-data-id="${inputData.id}" th:value="${inputData.sample}" autocomplete="off"/></th>
                    <th scope="col"><input class="form-control input-data-editor" type="text" data-input-data-property="timePoint" th:data-input-data-id="${inputData.id}" th:value="${inputData.timePoint}" autocomplete="off"/></th>
                    <th scope="col"><input class="form-control input-data-editor" type="number" step="any" min="0" data-input-data-property="plateDiameter" th:data-input-data-id="${inputData.id}" th:value="${inputData.plateDiameter}" autocomplete="off"/></th>
                    <th scope="col" th:if="${inputData.assayType.toString().equals('DDA')}">
                        <div class="btn btn-sm btn-outline-secondary">Auto (DDA)</div>
                    </th>
                    <th scope="col" th:if="${inputData.assayType.toString().equals('ETest')}">
                        <div class="dropdown">
                            <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false"
                                    th:text="${ !#strings.isEmpty(inputData.eTestZOIShapePresetName) ? inputData.eTestZOIShapePresetName : 'Unnamed'}"
                            th:style="${'border-color: ' + inputData.getZOIShapeHexColor() + ';'}">
                            </button>
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item disabled" href="#"><strong>MCA Rate</strong> <span th:text="${inputData.eTestZOIShapePresetMcaRate}"></span></a></li>
                                <li><a class="dropdown-item disabled" href="#"><strong>MCA Intercept</strong> <span th:text="${inputData.eTestZOIShapePresetMcaIntercept}"></span></a></li>
                                <li><a class="dropdown-item disabled" href="#"><strong>Strip Rate</strong> <span th:text="${inputData.eTestZOIShapePresetStripRate}"></span></a></li>
                                <li><a class="dropdown-item disabled" href="#"><strong>Strip Intercept</strong> <span th:text="${inputData.eTestZOIShapePresetStripIntercept}"></span></a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li th:each="preset: ${zoiShapes}"><a class="dropdown-item" href="#" th:text="${!#strings.isEmpty(preset.name) ? preset.name : 'Unnamed'}"></a></li>
                            </ul>
                        </div>
                    </th>
                </tr>
                </tbody>
            </table>
        </div>

<!--        <div class="d-flex justify-content-end mt-4 gap-3">-->
<!--            <button type="button" class="btn btn-outline-primary button-add-data"><i class="fa fas fa-plus-circle"></i> Add data</button>-->
<!--        </div>-->
    </div>
</div>
