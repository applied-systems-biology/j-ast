<div th:fragment="log" class="card bg-light" >
  <div class="card-header d-flex align-items-center gap-2">
    <span>Log</span>
    <div class="flex-grow-1"></div>
    <a class="btn btn-success" th:href="@{'/dataset/download-log/' + ${currentDatasetId}}">
      <i class="fa fas fa-download"></i> Download full log
    </a>
  </div>
  <div class="card-body">
    <textarea id="log" class="form-control font-monospace dataset-run-log" readonly autocomplete="off">
    </textarea>
    <p class="text-muted small">
      For performance reasons, only the last 500 log lines are displayed
    </p>
  </div>
  <div class="card-footer d-flex align-items-center justify-content-end gap-2">
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" role="switch" id="log-autoscroll" checked>
      <label class="form-check-label" for="log-autoscroll">Autoscroll</label>
    </div>
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" role="switch" id="log-keep-updated" checked>
      <label class="form-check-label" for="log-keep-updated">Keep up-to-date</label>
    </div>
  </div>
  <script>
    function updateLog(message) {
      if($("#log-keep-updated").prop("checked")) {
        $("#log").text(message)
        if($("#log-autoscroll").prop("checked") ) {
          const textarea = document.getElementById('log');
          textarea.scrollTop = textarea.scrollHeight;
        }
      }
    }
  </script>
</div>
