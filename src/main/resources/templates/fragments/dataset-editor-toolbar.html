<div class="row" th:fragment="dataset-editor-toolbar">
  <div class="col">
    <nav class="navbar bg-light rounded border p-3 d-flex flex-row gap-2">
      <div th:if="${currentDatasetOwnedByOtherUser}" class="text-danger">
        <i class="fa-solid fa-circle-user"></i>
        Owned by
        <span th:text="${currentDatasetOwner}"></span>
      </div>
      <button type="button" class="btn btn-outline-primary button-rename" data-bs-toggle="modal"
              data-bs-target="#modal-rename"><i class="fa fas fa-edit"></i> Rename
      </button>
      <button type="button" class="btn btn-outline-danger button-delete" data-bs-toggle="modal"
              data-bs-target="#modal-delete"><i class="fa fas fa-xmark-circle"></i> Delete
      </button>
      <div class="flex-grow-1"></div>
      <div class="text-muted me-2 data-save-info-default" style="display: none">
        <i class="fa fas fa-save"></i>
        <span>All settings are automatically saved</span>
      </div>
      <div class="text-muted me-2 data-save-info-saving" style="display: none">
        <i class="fa-solid fa-circle-notch fa-spin"></i>
        <span>Uploading changes ...</span>
      </div>
      <div class="text-danger me-2 data-validation-invalid" style="display: none">
        <i class="fa-solid fa-warning"></i>
        <span>Problems detected!</span>
      </div>
      <button type="button" class="btn btn-success button-run" data-bs-toggle="modal" data-bs-target="#modal-run" disabled>
        <i class="fa fas fa-play-circle"></i> Run analysis
      </button>
    </nav>
  </div>
</div>
