<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base.html}">
<body>
<section layout:fragment="content" class="container-fluid pt-3">
   <div th:replace="~{fragments/dataset-editor-toolbar.html :: dataset-editor-toolbar}"></div>
    <div class="row mt-3 mb-3">
        <div class="col-lg-7 d-flex flex-column gap-2">
            <div th:replace="~{fragments/dataset-editor-parameters.html :: dataset-editor-parameters}"></div>
        </div>
        <div class="col-lg d-flex flex-column gap-2">
            <div th:replace="~{fragments/dataset-editor-validation.html :: dataset-editor-validation}"></div>
            <div th:replace="~{fragments/dataset-editor-uploader.html :: dataset-editor-uploader}"></div>
        </div>
    </div>
    <div class="row mt-3 mb-3">
        <div class="col">
            <div th:replace="~{fragments/dataset-editor-table.html :: dataset-editor-table}"></div>
        </div>
    </div>

    <div th:replace="~{fragments/modal-rename.html :: modal-rename}"></div>
    <div th:replace="~{fragments/modal-delete.html :: modal-delete}"></div>
    <div th:replace="~{fragments/modal-run.html :: modal-run}"></div>
    <script th:inline="javascript">
        let updateTimerHandle = 0;

        function updateSaveProgress(inProgress) {
            $(".data-save-info-default").toggle(!inProgress)
            $(".data-save-info-saving").toggle(inProgress)
        }

        function updateInputDataAndParameters() {
            let message = {
                parameters: {},
                inputData: {}
            }
            $(".input-data-editor").each(function() {
                const inputDataId = $(this).data("inputDataId")
                const inputDataIdKey = "" + inputDataId
                const inputDataProperty = $(this).data("inputDataProperty")
                const value = $(this).val()

                if(inputDataId === undefined) {
                    return
                }

                // Add to map if not exists
                if(!(inputDataIdKey in message.inputData)) {
                    message["inputData"][inputDataIdKey] = {
                        id: inputDataId
                    }
                }

                // set the property
                message.inputData[inputDataIdKey][inputDataProperty] = $(this).val()
            })
            $(".input-parameter-editor").each(function () {
                const parameterProperty = $(this).data("parameterProperty")
                const value = $(this).val()

                if(parameterProperty === undefined) {
                    return
                }

                message["parameters"][parameterProperty] = value
            })

            // console.log(JSON.stringify(message))

            // Fix checkbox
            message["parameters"]["ensure-circular-plate"] = $('#parameter-ensure-circular-plate').prop('checked')

            const token = $('#_csrf').attr('content');
            const header = $('#_csrf_header').attr('content');
            return $.ajax(getURL("dataset/update/" + currentDatasetId), {
                type: "POST",
                data: JSON.stringify(message),
                dataType: "html",
                contentType: 'application/json',
                mimeType: 'application/json',
                beforeSend: function (xhr) {
                    xhr.setRequestHeader(header, token);
                },
            })
        }

        function registerDeleteInputData() {
            $(".input-data-editor .button-delete-input-data").click(function () {
                const inputDataId = $(this).data("inputDataId")
                $("#input-data-editor-" + inputDataId).fadeOut(function () {
                    $(this).remove()
                })
                const token = $('#_csrf').attr('content');
                const header = $('#_csrf_header').attr('content');
                $.ajax(getURL("input-data/delete/" + inputDataId), {
                    type: "POST",
                    beforeSend: function (xhr) {
                        xhr.setRequestHeader(header, token);
                    },
                })
                    .always(function () {
                        runValidation()
                    })
            })
        }

        function runValidation() {
            $(".button-run").prop("disabled", true)
            $(".validation-status-running").show()
            $(".validation-status-success").hide()
            $(".validation-issues").html("")
            $(".data-validation-invalid").hide()

            $.getJSON(getURL("dataset/validate/" + currentDatasetId), function (data) {
                if(data["is-valid"]) {
                    $(".button-run").prop("disabled", false)
                    $(".validation-status-success").show()
                }
                else {
                    $(".data-validation-invalid").show()
                    for (const issue of data["issues"]) {
                        $(".validation-issues").append(`
                         <div class="card-body border-top bg-danger bg-opacity-75 text-bg-danger validation-status-success">
                            <h5 class="card-title"><i class="fa-solid fa-warning"></i> ${issue["title"]}</h5>
                            <p class="card-text">${issue["message"]}</p>
                        </div>
                        `)
                    }
                }
            })
                .fail(function () {

                })
                .always(function () {
                    $(".validation-status-running").hide()
                })
        }

        function scheduleUpdateTimer() {
            if(updateTimerHandle !== 0) {
                clearTimeout(updateTimerHandle);
            }
            $(".button-run").prop("disabled", true)
            $(".data-save-info-default").hide()
            $(".data-save-info-saving").show()
            updateTimerHandle = setTimeout(function () {
                updateInputDataAndParameters().always(function () {
                    $(".data-save-info-saving").hide()
                    $(".data-save-info-default").show()
                    runValidation()
                })
            }, 1000)
        }

        function registerUpdateSchedulerListeners() {
            $(".input-data-editor").on("input", function () {
                scheduleUpdateTimer()
            })
            $(".input-parameter-editor").on("input", function () {
                scheduleUpdateTimer()
            })
        }

        $(document).ready(() => {
            updateSaveProgress(false)
            registerDeleteInputData()
            registerUpdateSchedulerListeners()
            runValidation()
        })
    </script>
    <script th:inline="javascript">
        function reloadOnStatusChange() {
            $.getJSON(getURL("dataset/query-status/" + currentDatasetId), function (data) {
                if(data["status"] !== "Preparing") {
                    location.reload()
                }
            });
        }

        $(document).ready(() => {
            setInterval(function () {
               reloadOnStatusChange()
            }, 1000)
        })
    </script>
</section>
</body>
</html>
