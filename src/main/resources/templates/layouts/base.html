<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="/bootstrap/css/bootstrap.css"/>
    <link href="/fontawesome/css/all.css" rel="stylesheet">
    <link rel="stylesheet" href="/custom.css" />
    <title>Growth Assay Analyzer</title>
</head>
<body>
<script src="/jquery/jquery-3.6.4.min.js"></script>
<script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    const currentDatasetId = [[${currentDatasetId}]]

    function getURL(path) {
        return [[@{'/'}]] + path
    }
</script>
<nav class="navbar navbar-expand-lg navbar-light bg-light border-bottom">
    <a class="navbar-brand" th:href="@{/}">
        <img src="/img/jipipe-webapp-logo.png" class="logo" alt="logo"/>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto">
            <li class="nav-item">
                <a class="nav-link" href="https://www.jipipe.org/" target="_blank"><i class="fas fa-question-circle"></i> Learn more about JIPipe</a>
            </li>
        </ul>
    </div>
</nav>
<section layout:fragment="jumbotron">
</section>
<div class="container-fluid ps-0 pe-0">
    <div class="d-flex flex-column flex-lg-row">
        <div class="bg-light border-end pt-1">
            <div class="list-group m-2">
                <a class="list-group-item list-group-item-action list-group-item-success d-flex justify-content-between align-items-center text-nowrap" href="/dataset/new">
                    <span>Upload new dataset</span>
                    <i class="fas fa-plus-circle ms-3"></i>
                </a>
                <th:block th:each="dataset: ${datasets}">
                    <a class="list-group-item list-group-item-action d-flex justify-content-between align-items-center text-nowrap" th:classappend="${dataset.id == currentDatasetId ? 'active' : ''}" th:href="@{'/dataset/view/' + ${dataset.id}}">
                        <span th:text="${dataset.name}"></span>
                        <i class="fas fa-folder-open ms-3"></i>
                    </a>
                </th:block>

            </div>
        </div>
        <div class="template-content flex-grow-1">
            <section layout:fragment="content">
                <p>Page content goes here</p>
            </section>
        </div>
    </div>
</div>
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div th:each="notification: ${notifications}" th:id="${notification.id}" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="toast-header" th:classappend="'bg-' + ${notification.style} + ' ' + 'text-bg-' + ${notification.style} ">
            <strong class="me-auto" th:text="${notification.title}"></strong>
            <button type="button" class="btn btn-sm" th:classappend="'text-bg-' + ${notification.style} " data-bs-dismiss="toast" aria-label="Close"><i class="fa fas fa-times"></i></button>
        </div>
        <div class="toast-body" th:text="${notification.text}">
        </div>
    </div>
</div>
<footer class="bg-light pt-5 pb-5 border-top">
    <div class="container text-center">
        <div class="row" >
            <div class="text-start text-muted small" th:utext="${footerText}"></div>
        </div>
        <div class="row justify-content-md-center">
            <div th:each="item: ${footerLinks}" class="col-md-auto">
                <a th:href="${item.url}" th:target="${item.target}" th:text="${item.name}"></a>
            </div>
        </div>
    </div>
</footer>
<script>
    $(document).ready(() => {
        const toastElList = [].slice.call(document.querySelectorAll('.toast'));
        const toastList = toastElList.map(function (toastEl) {
            return bootstrap.Toast.getOrCreateInstance(toastEl, {delay: 10000})
        });
        toastList.forEach(toast => toast.show());
    });
</script>
</body>
</html>
