<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base.html}">
<body>
<section layout:fragment="content" class="container-fluid pt-3">
    <div class="row">
        <div class="col">
            <nav class="navbar bg-light rounded border p-3 d-flex flex-row gap-2">
                <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal"
                        data-bs-target="#modal-rename"><i class="fa fas fa-edit"></i> Rename
                </button>
                <button type="button" class="btn btn-outline-danger" data-bs-toggle="modal"
                        data-bs-target="#modal-delete"><i class="fa fas fa-xmark-circle"></i> Delete
                </button>
                <div class="flex-grow-1"></div>
                <div class="text-success me-2">
                    <i class="fa-solid fa-check-circle"></i>
                    <span>The analysis was successful!</span>
                </div>
                <button type="button" class="btn btn-danger button-run" data-bs-toggle="modal" data-bs-target="#modal-reset">
                    <i class="fa fas fa-undo"></i> Discard results
                </button>
                <a class="btn btn-success button-run" th:href="@{'/dataset/download-results/zip/' + ${currentDatasetId}}">
                    <i class="fa fas fa-download"></i> Download all results
                </a>
            </nav>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col d-flex flex-column gap-2">
            <div th:replace="~{fragments/results-viewer.html :: results-viewer}" class="card bg-light">
            </div>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col d-flex flex-column gap-2">
            <div th:replace="~{fragments/log.html :: log}" class="card bg-light">
            </div>
        </div>
    </div>
    <div th:replace="~{fragments/modal-rename.html :: modal-rename}"></div>
    <div th:replace="~{fragments/modal-delete.html :: modal-delete}"></div>
    <div th:replace="~{fragments/modal-reset.html :: modal-reset}"></div>
    <script th:inline="javascript">
        function queryStatus() {
            $.getJSON(getURL("dataset/query-status/" + currentDatasetId), function (data) {
                if(data["status"] !== "RunFinished") {
                    location.reload()
                }
                updateLog(data["log"])
            });
        }

        $(document).ready(() => {
            $("#log").text("Preparing log ...")
            setInterval(function () {
                queryStatus()
            }, 1000)
        })
    </script>
</section>
</body>
</html>
