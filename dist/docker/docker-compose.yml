name: j-ast
volumes:
  j_ast_data:
  j_ast_jipipe_artifacts:
services:
  webapp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CACHEBUST: ${CACHEBUST} # Use environment variable or default value
    restart: always
    ports:
      - "8193:8081"
    depends_on:
      -  mariadb
    environment:
    # Context path (deploying the app)
      SERVER_SERVLET_CONTEXT_PATH: '/j-ast-new'
    # Memory for Fiji (8G = 8GB)
      RUNTIME_FIJI_ARGS_1: 8G
    # Maximum number of background jobs
      ORG_JOBRUNR_BACKGROUND_JOB_SERVER_WORKER_COUNT: 4
    # Maximum image size for uploads
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 10MB
    # Root admin credentials
      ACCOUNTS_ADMIN_USERNAME: 'admin@webapp'
      ACCOUNTS_ADMIN_PASSWORD: 'TZ6ZM2nmREUNyfya'
    # Database config
      SPRING_DATASOURCE_URL: "jdbc:mariadb://mariadb:3306/j-ast"
      SPRING_DATASOURCE_USERNAME: j-ast
      SPRING_DATASOURCE_PASSWORD: lBpuJweTQWGhvr0o
    #  SPRING_JPA_DATABASE_PLATFORM: "org.hibernate.dialect.MariaDBDialect"
    #  SPRING_DATASOURCE_DRIVERCLASSNAME: "org.mariadb.jdbc.Driver"
    # Data config
      RUNTIME_DATA_DIRECTORY: /webapp_data
      RUNTIME_CUSTOM_TEMP_DIRECTORY: /tmp
      RUNTIME_SHARED_RESOURCES_DIRECTORY: /opt/app/share
    volumes:
      - j_ast_data:/webapp_data
      - j_ast_jipipe_artifacts:/root/.local/share/JIPipe/artifacts
  mariadb:
    image: "mariadb:latest"
    restart: always
    expose:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: j-ast
      MYSQL_USER: j-ast
      MYSQL_PASSWORD: lBpuJweTQWGhvr0o
      MYSQL_ROOT_PASSWORD: ngek9RlN1BS3K82i
    volumes:
      - j_ast_data:/var/lib/mysql
    
