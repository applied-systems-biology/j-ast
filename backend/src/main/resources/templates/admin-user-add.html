<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/base.html}">
<body>
<section layout:fragment="content" class="container-fluid pt-3">
    <form action="#" th:action="@{/admin/add-user}" method="post" autocomplete="off" class="needs-validation" novalidate>
        <div class="row mt-3 mb-3">
            <div class="col">
                <div class="card bg-light">
                    <div class="card-header d-flex align-items-center justify-content-between">
                        <span>Create new account</span>
                        <button type="submit" class="btn btn-success button-add-data">
                            <i class="fa-solid fa-user-plus"></i> Create
                        </button>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="account-username" class="form-label">User name</label>
                            <input type="email" class="form-control" id="account-username" name="email" required>
                            <div class="invalid-feedback">
                                Please provide a username/E-mail.
                            </div>
                        </div>
                        <div class="mb-5">
                            <label for="account-role" class="form-label">Role</label>
                            <select type="text" class="form-select" id="account-role" name="role" required>
                                <option value="User">User</option>
                                <option value="Guest">Guest</option>
                                <option value="Admin">Admin</option>
                            </select>
                            <div class="invalid-feedback">
                                Please select the role of the user.
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="account-first-name" class="form-label">First name</label>
                            <input type="text" class="form-control" id="account-first-name" name="firstName" >
                        </div>
                        <div class="mb-5">
                            <label for="account-last-name" class="form-label">Last name</label>
                            <input type="text" class="form-control" id="account-last-name" name="lastName">
                        </div>
                        <div class="mb-5">
                            <label for="account-affiliation" class="form-label">Affiliation</label>
                            <input type="text" class="form-control" id="account-affiliation" name="affiliation">
                        </div>
                        <div class="mb-3">
                            <label for="account-new-password" class="form-label">Password</label>
                            <input type="password" class="form-control password-form-control" id="account-new-password" name="newPassword" autocomplete="new-password" required>
                            <div class="invalid-feedback">
                                Please set the user's password.
                            </div>
                        </div>
                        <div class="mb-5">
                            <label for="account-new-password-confirm" class="form-label">Confirm password</label>
                            <input type="password" class="form-control password-form-control" id="account-new-password-confirm" name="newPasswordConfirm" autocomplete="new-password" required>
                            <div class="invalid-feedback">
                                Please ensure that the two passwords are equal.
                            </div>
                        </div>
                        <div class="mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" role="switch" id="account-allow-login" name="allowLogin" checked>
                                <label class="form-check-label" for="account-allow-login">Enable login</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
    <script>
        function checkPasswords() {
            const passwordField = $("#account-new-password")
            const passwordConfirmField = $("#account-new-password-confirm")
            if(passwordField.val() === passwordConfirmField.val()) {
                passwordConfirmField.get(0).setCustomValidity("")
            }
            else {
                passwordConfirmField.get(0).setCustomValidity("invalid")
            }
        }

        $(document).ready(function () {
            $(".password-form-control").on("input", checkPasswords)
            $(".needs-validation").on("submit", function (event) {
                const form = $(this).get(0)

                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }

                form.classList.add('was-validated')

            })
        })
    </script>
</section>
</body>
</html>
