server:
  port: 8081
spring:
  datasource:
    url: jdbc:h2:file:./storage/database
    username: sa
    password: password
    driverClassName: org.h2.Driver
#    url: 'jdbc:mariadb://localhost:3306/jipipe_growth_assay'
#    username: jipipe_web
#    password: jipipe_web
#    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
org:
  jobrunr:
    background-job-server:
      enabled: true
      worker-count: 2
      poll-interval-in-seconds: 1
    dashboard:
      enabled: true
runtime:
  fiji-path: 'bin/jipipe-linux'
  fiji-executable-path: 'bin/jipipe-linux/ImageJ-linux64'
  fiji-args: ['--memory', '8G']
  fiji-wrapper-enabled: true
  fiji-wrapper: '/usr/bin/xvfb-run'
  fiji-wrapper-args: [ '-a' ]
  custom-temp-directory: "./storage/data"
  shared-resources-directory: "./share"
accounts:
  admin-username: 'admin@localhost'
